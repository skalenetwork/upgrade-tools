# cspell:words ncipollo

name: publish
on:
  push:
    branches-ignore:
      - stable
      - beta
      - develop
  pull_request:
    types: [closed]
    branches:
      - stable
      - beta
      - develop
env:
  NODE_VERSION: 24

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'

    - name: Install project
      run: |
        yarn

    - name: Compile typescript
      run: yarn compile

    - name: Determine version
      run: |
        export BRANCH=${GITHUB_REF##*/}
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "Branch $BRANCH"
        export VERSION=$(bash ./scripts/calculate_version.sh)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version $VERSION"
        ( test $BRANCH = "stable" && export PRERELEASE=false ) || export PRERELEASE=true
        echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

    - name: Publish NPM package
      run: ./scripts/publish_package.sh
      env:
        BRANCH: ${{ env.BRANCH }}

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.VERSION }}
        prerelease: ${{ env.PRERELEASE }}
        commit: ${{ github.sha }}

  clean:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Remove feature tag
      run: |
        export SOURCE_BRANCH=$(echo ${GITHUB_HEAD_REF##*/} | tr [:upper:] [:lower:] | tr -d [:space:])
        echo "Source branch: $SOURCE_BRANCH"
        npm install -g npm@latest
        npm dist-tag rm @${{ github.repository }} $SOURCE_BRANCH
